# Analyse, tests, puis builds Android et iOS, à chaque push sur main et sur
# chaque pull request. Aucun secret nécessaire : les builds ne sont pas
# signés (APK signé avec la clé de debug, iOS sans signature) et servent
# seulement à vérifier que l'app compile sur chaque plateforme.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Le workflow ne fait que lire le code.
permissions:
  contents: read

# Un nouveau push sur une PR annule l'exécution précédente.
# Sur main, chaque exécution va au bout.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-and-test:
    name: Analyse et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Préparer Flutter
        uses: ./.github/actions/setup-flutter

      # Les remarques de niveau info font aussi échouer l'analyse, pour
      # garder un projet à zéro avertissement.
      - name: Analyse
        run: flutter analyze

      - name: Tests et couverture
        run: flutter test --coverage

      # Même si les tests échouent, pour pouvoir lire le rapport.
      - name: Publier le rapport de couverture
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  node:
    name: Cloud Functions et outils
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      # Même version que le runtime des fonctions (engines dans
      # functions/package.json).
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Installer les dépendances des fonctions
        working-directory: functions
        run: npm ci

      - name: Tests des fonctions
        working-directory: functions
        run: npm test

      - name: Tests du script de migration
        if: ${{ hashFiles('tools/migration/package-lock.json') != '' }}
        working-directory: tools/migration
        run: |
          npm ci
          npm test

  build-android:
    name: Build Android
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      # Le plugin Android Gradle 8.11 demande Java 17 au minimum.
      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer Flutter
        uses: ./.github/actions/setup-flutter

      # Sans configuration de signature release, l'APK est signé avec la
      # clé de debug (voir android/app/build.gradle.kts) : il n'est pas
      # publiable, mais la compilation complète est vérifiée.
      - name: APK release
        run: flutter build apk --release

  build-ios:
    name: Build iOS (sans signature)
    needs: analyze-and-test
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Préparer Flutter
        uses: ./.github/actions/setup-flutter

      # --no-codesign : aucun certificat Apple nécessaire. Le résultat ne
      # s'installe pas sur un iPhone, il prouve seulement que le projet iOS
      # compile (dépendances natives, version minimale d'iOS, Firebase).
      - name: App iOS release
        run: flutter build ios --release --no-codesign
